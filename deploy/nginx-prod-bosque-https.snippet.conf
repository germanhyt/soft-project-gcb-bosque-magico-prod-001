# ========== PROD BOSQUE MAGICO (HTTPS) ==========
# Cert: /etc/letsencrypt/live/bosquemagico.gcbprojects.site/
# API bajo /api en cada host (mismo origen).

server {
    listen 443 ssl;
    server_name admin.bosquemagico.gcbprojects.site;

    ssl_certificate /etc/letsencrypt/live/bosquemagico.gcbprojects.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosquemagico.gcbprojects.site/privkey.pem;

    location /api/ {
        proxy_pass http://62.169.23.24:3011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /socket.io/ {
        proxy_pass http://62.169.23.24:3011/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://62.169.23.24:4183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

