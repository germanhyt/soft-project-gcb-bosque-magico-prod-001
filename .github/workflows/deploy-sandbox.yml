name: Deploy Sandbox VPS

on:
  push:
    branches: [sandbox]
  workflow_dispatch:

concurrency:
  group: deploy-sandbox
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Docker sandbox on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd "${{ secrets.SANDBOX_REPO_PATH }}"
            git fetch --all
            git checkout sandbox
            git pull origin sandbox
            docker compose -f docker-compose.sandbox.yml up -d --build postgres
            docker compose -f docker-compose.sandbox.yml up -d --build api panel landing
            docker compose -f docker-compose.sandbox.yml logs api --tail 80

      - name: Verify sandbox API
        run: |
          curl -sf "https://sandbox-api-bosque.gcbprojects.site/api/health"
          curl -sf "https://sandbox-api-bosque.gcbprojects.site/api/public/bosque-magico/catalogo" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['productos']['shows'])>0, 'sin shows'"
