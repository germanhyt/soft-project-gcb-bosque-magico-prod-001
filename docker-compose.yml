services:
  postgres:
    image: postgres:16-alpine
    container_name: bosque-magico-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bosque_magico
    volumes:
      - bosque_magico_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bosque_magico']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  bosque_magico_pg:
